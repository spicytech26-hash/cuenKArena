# Fly.io — servidor en São Paulo (gru), el más cercano a Misiones.
# Pasos: instalar flyctl, `fly launch --no-deploy --copy-config` (elegí un nombre libre) y `fly deploy`.
app = "cuenkarena"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  BOTS = "0"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
